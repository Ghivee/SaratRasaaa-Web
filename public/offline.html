<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Saratrasaa — Offline</title>
    <style>
      :root {
        --pink: #ff2d78;
        --pink-soft: #ffd6e5;
        --bg: #fff6f2;
        --ink: #1f1115;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        padding: 1.5rem;
        text-align: center;
      }
      .card {
        max-width: 28rem;
        background: #fff;
        border-radius: 1.25rem;
        padding: 2.5rem 1.75rem;
        box-shadow: 0 12px 40px -8px rgba(255, 45, 120, 0.18);
        border: 1px solid var(--pink-soft);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        background: var(--pink-soft);
        color: var(--pink);
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        padding: 0.35rem 0.75rem;
        border-radius: 999px;
        margin-bottom: 1rem;
      }
      .dot {
        display: inline-block;
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 999px;
        background: var(--pink);
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.4;
        }
        50% {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .dot {
          animation: none;
        }
      }
      h1 {
        margin: 0.5rem 0 0.75rem;
        font-size: 1.6rem;
        font-weight: 800;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0.5rem 0;
        color: #6b5a5f;
        line-height: 1.55;
        font-size: 0.95rem;
      }
      .wordmark {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin-bottom: 0.25rem;
      }
      .wordmark::before {
        content: "";
        display: inline-block;
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 999px;
        background: var(--pink);
      }
      .retry {
        margin-top: 1.5rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--pink);
        color: #fff;
        border: none;
        padding: 0.75rem 1.5rem;
        border-radius: 999px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        transition: transform 0.1s ease;
      }
      .retry:hover {
        transform: translateY(-1px);
      }
      .retry:active {
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="wordmark">Saratrasaa</span>
      <div class="badge"><span class="dot"></span> Offline</div>
      <h1>Kamu sedang offline</h1>
      <p>
        Beberapa fitur Saratrasaa butuh koneksi internet — seperti mendaftar
        event, cek status, dan bayar via QRIS.
      </p>
      <p>
        Sambungkan ke internet lalu coba lagi. Halaman yang sudah pernah kamu
        buka tetap bisa dilihat.
      </p>
      <a class="retry" href="/">Coba lagi</a>
    </div>
    <script>
      // Auto-reload when the connection comes back.
      window.addEventListener("online", function () {
        window.location.reload();
      });
    </script>
  </body>
</html>
